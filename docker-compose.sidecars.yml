# Heretek-Crew: Master Supporting Software & Sidecars Specification
# Composable alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.sidecars.yml --profile web-research up -d

services:
  # ============================================================================
  # CATEGORY A: WEB INGESTION, CRAWLING & SEARCH
  # ============================================================================
  searxng-redis:
    # Wave 4 P1-4: redis:7.4.1-alpine -> 7.4.11-alpine (fixes CVE-2025-49844
    # RCE <7.4.6; Hub tag 7.4.11-alpine verified live 2026-10-17). Authenticated
    # via REDIS_PASSWORD (fail-closed :? guard); healthcheck authenticates.
    image: redis:7.4.11-alpine
    profiles: ["web-research"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:?} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - heretek
    cpus: "0.2"
    mem_limit: 256m

  searxng:
    # Pinned by digest 2026-10-17 (skopeo inspect; tag 2025.12.19-8bf600cc6 = newest Hub tag).
    # Old tag 2024.10.16-ac56c663b was pruned upstream (Hub 404).
    image: searxng/searxng@sha256:13de9d465bd2d9da6a6718f2a57d96e6e5fa3b8aba3c0bec077a5b7e5f24e4e9
    profiles: ["web-research"]
    restart: unless-stopped
    depends_on:
      - searxng-redis
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@searxng-redis:6379/0"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "1.0"
    mem_limit: 1g

  firecrawl-redis:
    # Wave 4 P1-4: redis:7.4.1-alpine -> 7.4.11-alpine (CVE-2025-49844).
    # Authenticated via REDIS_PASSWORD (shared with searxng-redis; one
    # secret, fail-closed :? guard); healthcheck authenticates.
    image: redis:7.4.11-alpine
    profiles: ["web-research"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:?} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - firecrawl-redis-data:/data
    networks:
      - heretek
    cpus: "0.5"
    mem_limit: 512m

  firecrawl-rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    # MIGRATED 2026-10-17 (P0-7): 3.13.7 (community EOL 2024-09-30) -> 4.3.6.
    # RabbitMQ 4.x enables quorum queues by default for newly declared
    # classic-compatible queues; Firecrawl's crawl-queue declarations must be
    # smoke-tested (see P0-7: run the crawl-queue smoke below) before prod use.
    # Wave D P2-8: consider 1g mem_limit at the next rotation (512m is lean
    # for management + quorum overhead — monitor for memory pressure).
    # Wave D P3-3 (guest rotation, env-provided): default guest creds are
    # disclosed in-file upstream and this service is expose-only, but any
    # heretek-networked container can reach the broker — so auth is now
    # env-provided (RABBITMQ_USER/RABBITMQ_PASSWORD, fail-closed :?; see
    # .env.example). NOTE: these vars are read ONLY on first boot against a
    # fresh volume — rotating them on an existing volume needs
    # `rabbitmqctl add_user/change_password` inside the container, not just
    # a re-up (tracked operator step).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env (firecrawl broker user; replaces default guest)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (generate with openssl rand -base64 24)}
    profiles: ["web-research"]
    restart: unless-stopped
    command: rabbitmq-server
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - firecrawl-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - heretek
    cpus: "0.5"
    mem_limit: 512m

  firecrawl-nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:9b638af78d99873bc0ba2b57c9cbcd01df6ce96efeaa72d36cfbe0f76521e8fc
    profiles: ["web-research"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIRECRAWL_DB_USER:-firecrawl}
      POSTGRES_PASSWORD: ${FIRECRAWL_DB_PASSWORD:?FIRECRAWL_DB_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-firecrawl} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - firecrawl-nuq-data:/var/lib/postgresql/data
    networks:
      - heretek
    cpus: "0.5"
    mem_limit: 768m

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service@sha256:717699bf8a61d94451926c810d19ca1d36278192907e307bf5229a558b08fcc6
    profiles: ["web-research"]
    restart: unless-stopped
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "10"
      BLOCK_MEDIA: "true"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=512m
    networks:
      - heretek
    cpus: "1.0"
    mem_limit: 2g

  firecrawl:
    # Wave D P2-8 version plan (tracked, honest): `:2.10.19` is a mutable
    # tag while 4 sibling deps are digest-pinned. The target is a digest
    # pin with a `#:2.10.19` human-readable comment — but the digest MUST
    # be resolved live (`docker manifest inspect
    # ghcr.io/firecrawl/firecrawl:2.10.19`), never invented offline.
    # Until that verification runs, the exact tag stays with this plan
    # attached (no blind bump, no floating `latest`).
    image: ghcr.io/firecrawl/firecrawl:2.10.19
    profiles: ["web-research"]
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-nuq-postgres:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_healthy
    expose:
      - "3002"
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      INTERNAL_PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      ENV: "local"
      LOGGING_LEVEL: "warn"
      # Wave D P1-5 auth decision (tracked, honest): unauthenticated local
      # access stays ONLY because (a) :3002 is loopback-published
      # (127.0.0.1:3002:3002 — never all-interfaces) AND expose-only on
      # the heretek net, and (b) the crawl API fetches arbitrary URLs by
      # design (SSRF primitive for anyone reaching :3002). The hardening
      # path is USE_DB_AUTHENTICATION=true + a provisioned secret (needs a
      # firecrawl user/secret bootstrap that does not exist upstream for
      # the self-host harness — verify before flipping, or the service
      # fails closed at boot). Until then: keep :3002 loopback-only (smoke
      # §3a asserts it) and treat crawler access as host-trust-boundary.
      USE_DB_AUTHENTICATION: "false"
      HARNESS_STARTUP_TIMEOUT_MS: "60000"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@firecrawl-redis:6379"
      REDIS_RATE_LIMIT_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@firecrawl-redis:6379"
      PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000/scrape"
      NUQ_RABBITMQ_URL: "amqp://${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@firecrawl-rabbitmq:5672"
      POSTGRES_USER: ${FIRECRAWL_DB_USER:-firecrawl}
      POSTGRES_PASSWORD: ${FIRECRAWL_DB_PASSWORD:?FIRECRAWL_DB_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
      POSTGRES_HOST: "firecrawl-nuq-postgres"
      POSTGRES_PORT: "5432"
      NUM_WORKERS_PER_QUEUE: "4"
      CRAWL_CONCURRENT_REQUESTS: "10"
      MAX_CONCURRENT_JOBS: "5"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - heretek
    cpus: "1.5"
    mem_limit: 2g

  gotenberg:
    # Pinned 2026-10-17: 8.37.0 >= 8.33.0 fixes CVE-2026-42596 (SSRF 9.4, fixed
    # 8.32.0), CVE-2026-44829 (traversal, fixed 8.33.0), CVE-2026-42592 (SSRF).
    image: gotenberg/gotenberg:8.37.0
    profiles: ["web-research", "qa-testing"]
    restart: unless-stopped
    expose:
      - "3000"
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--chromium-restart-after=30"
      - "--chromium-auto-start=true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "1.0"
    mem_limit: 1.5g

  # ============================================================================
  # CATEGORY B: RESILIENT & STEALTH BROWSER AUTOMATION
  # ============================================================================
  browserless:
    image: ghcr.io/browserless/chromium:v2.24.2
    profiles: ["web-research", "qa-testing"]
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      CONCURRENT: "5"
      QUEUED: "10"
      TIMEOUT: "60000"
      TOKEN: "${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN must be set in .env}"
      ENABLE_DEBUGGER: "true"
      DEFAULT_STEALTH: "true"
      DEFAULT_HEADLESS: "new"
      CHROME_REFRESH_TIME: "1800000"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/pressure || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "2.0"
    mem_limit: 3g

  mitmproxy:
    image: mitmproxy/mitmproxy:11.0.2
    # TEST-ONLY SCOPE (P1-6): intercept proxy confined to the qa-testing
    # profile — never enable alongside untrusted workloads. block_global
    # defaults to true so non-loopback/global traffic is refused unless a
    # test explicitly opts out at runtime.
    profiles: ["qa-testing"]
    restart: unless-stopped
    command: ["mitmweb", "--web-host", "0.0.0.0", "--web-port", "8081", "--set", "block_global=true"]
    expose:
      - "8080"
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - mitmproxy-certs:/home/mitmproxy/.mitmproxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - heretek
    cpus: "0.5"
    mem_limit: 512m

  # ============================================================================
  # CATEGORY C: DEFENSIVE BINARY ANALYSIS & REVERSE ENGINEERING
  # PROFILE GATING (P1-6): enable --profile devsec only for trusted
  # analysis work (samples mount read-only). Never co-schedule with
  # untrusted workloads on the same heretek network.
  # ============================================================================
  ghidra:
    # Wave D P2-8 version plan (tracked, honest): `blacktop/ghidra:11.2`
    # is a community image likely one minor behind. Target: verify :11.3+
    # exists upstream, then digest-pin it (never float `latest`); the
    # `pgrep -f ghidra` healthcheck below is weak (matches any ghidra
    # string) — the stronger probe is an HTTP hit on :1337 once the
    # server is up (verify on first devsec-profile boot). Until that
    # verification runs, 11.2 stays with this plan attached.
    image: blacktop/ghidra:11.2
    profiles: ["devsec"]
    restart: unless-stopped
    # Wave 4 P1-12 SEGMENTATION: untrusted-sample workloads (ghidra,
    # radare2) move off the shared heretek bridge onto the isolated
    # heretek-devsec net. paperclip joins that net too (see the paperclip
    # extension at the end of this file), so agent reachability is
    # preserved while lateral movement to web-research/ai-gateway/qa
    # sidecars is cut. Remaining single-net services are tracked (see
    # NETWORKS block rationale below).
    # Wave D P1-5 fronting plan (tracked, honest): ghidra :1337 serves
    # with no auth env upstream, and radare2 :9090 exposes /cmd/ code
    # execution — both are expose-only on the isolated heretek-devsec net,
    # but paperclip joins that net (agent reachability), so any
    # agent-code-exec bridges the segment by design (paperclip-as-bridge
    # residual, recorded in SUPPORTING_SERVICES.md). The structural fix is
    # a shared-secret sidecar proxy (or per-request tokens mounted only
    # into the roles that need RE tooling) in front of :1337/:9090 and the
    # piston :2000 API. Until that lands: never publish these ports to the
    # host, never co-schedule devsec with untrusted workloads.
    expose:
      - "1337"
    environment:
      # Capped below the 4g container limit (P1-9): JVM heap + off-heap
      # overhead must fit inside mem_limit — 4G heap against a 4g limit
      # risks OOM-kill.
      MAXMEM: "3G"
    volumes:
      - ./workspaces/binaries:/samples:ro
      - ghidra-projects:/ghidra/projects
    entrypoint: ["/entrypoint.sh"]
    command: ["server"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ghidra || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - heretek-devsec
    cpus: "2.0"
    mem_limit: 4g

  radare2:
    # Pinned by digest 2026-10-17 (skopeo inspect; tag 6.2.4 verified live on Hub).
    # Old tag 6.0.0 never existed upstream (Hub 404).
    # BIND NOTE (P1-6): the HTTP server listens on 0.0.0.0 INSIDE the
    # container but the service is expose-only (no host ports published),
    # so it is reachable only from heretek-networked containers.
    # Wave D P1-5 fronting plan: same paperclip-as-bridge residual as
    # ghidra above — r2 /cmd/ is unauthenticated RCE by design (piston
    # likewise has no upstream auth env; sabotage-qa-tester's exact-host
    # curl pins are the advisory layer, the sandbox is the only
    # enforcement layer). Front with a shared-secret proxy or
    # per-request tokens mounted only into needing roles (tracked);
    # until then: expose-only, isolated net, no untrusted co-scheduling.
    image: radare/radare2@sha256:88b7ff67710e12f430b269abc7714490e3a0c37e391521523148cbd6f9d2ae37
    profiles: ["devsec"]
    restart: unless-stopped
    expose:
      - "9090"
    working_dir: /samples
    volumes:
      - ./workspaces/binaries:/samples:ro
    command: ["r2", "-qc=H 0.0.0.0:9090", "/samples"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/cmd/? || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - heretek-devsec
    cpus: "1.0"
    mem_limit: 1g

  # ============================================================================
  # CATEGORY D: FAST CODEBASE SEARCH & AST ANALYSIS
  # ============================================================================
  hound:
    # Pinned by digest 2026-10-17 (skopeo inspect; tag 0.6.0 verified live on GHCR).
    # Upstream publishes 0.6.0 without the 'v' prefix (v0.6.0 was GHCR 404).
    # Wave C P1-14 TRACKED DECISION (hound is archived upstream): etsy/hound
    # is archived/inactive — no future CVE fixes; the digest above freezes
    # dead code. Options, in preference order: (a) migrate to a maintained
    # trigram index (livegrep, zoekt) with a pinned image + this service's
    # volume/API contract re-verified; (b) vendor hound-search/hound at a
    # fleet tag and self-build from the archived source. Until either
    # lands, the exact digest pin stays (no floating tag) and hound stays
    # on expose-only + loopback publish (blast radius: read-only index).
    # Wave D P2-8 host-port remap: the HOST side moves 6080 -> 6081
    # (container :6080 unchanged, so the healthcheck below still probes
    # container-local :6080). docker-android's noVNC owns host :6080 in
    # the mobile profile; the profiles are mutually exclusive and the
    # Makefile guard enforces it, but distinct host ports remove the
    # collision class entirely instead of relying on the guard alone.
    image: ghcr.io/hound-search/hound@sha256:5b7fd0982ce12ebf41cfdbb8ab7aac081679667e778a8641bcd3026c98fc470e
    profiles: ["devsec", "web-research"]
    restart: unless-stopped
    expose:
      - "6080"
    ports:
      - "127.0.0.1:6081:6080"
    volumes:
      - ./workspaces:/workspaces:ro
      - hound-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6080/api/v1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "1.0"
    mem_limit: 2g

  semgrep:
    # Wave 4 P1-10: semgrep/semgrep:1.97.0 -> 1.181.0 (Hub tag verified
    # live 2026-10-17; ~84 releases of rule/detection drift closed).
    image: semgrep/semgrep:1.181.0
    profiles: ["devsec", "qa-testing"]
    restart: unless-stopped
    volumes:
      - ./workspaces:/src:ro
      - semgrep-cache:/root/.cache/semgrep
    entrypoint: ["sleep", "infinity"]
    networks:
      - heretek
    cpus: "2.0"
    mem_limit: 3g

  # ============================================================================
  # CATEGORY E: ISOLATED EXECUTION SANDBOXES
  # ============================================================================
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: ["core", "devsec"]
    restart: unless-stopped
    expose:
      - "2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read-only proxy (fail-closed): POST/BUILD/EXEC/AUTH disabled so a
      # compromised container cannot create privileged containers, build
      # images, exec into containers, or use auth endpoints to escape.
      # Wave 3 P1-3 (design decision, option a): this proxy is GET-only BY
      # DESIGN, so nothing behind it can run mutating CI (`act` needs
      # create/build/exec). CI jobs run on the HOST Docker daemon via host
      # `act`, never through this proxy; the local-ci-runner container is a
      # quarantined read-only observer (inspect/list/diagnose only — see its
      # comment). The read-only posture is never weakened to "fix" CI.
      # Wave D P1-6 accepted-risk residual: `expose: 2375` (no host ports)
      # still lets ANY container on the shared heretek net run unauthenticated
      # GET-recon (list images/containers, info/version). Accepted because
      # the net is compose-managed and every attached workload is fleet
      # first-party — but never attach untrusted third-party containers to
      # the heretek net, and never publish :2375 to the host.
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      VERSION: "1"
      POST: "0"
      BUILD: "0"
      EXEC: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      NODES: "0"
      SWARM: "0"
      SYSTEM: "0"
      AUTH: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/version || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - heretek
    cpus: "0.2"
    mem_limit: 128m

  piston:
    # Pinned by digest of upstream 'latest' 2026-10-17 (skopeo inspect → sha256:2f66b745...).
    # Upstream publishes ONLY the 'latest' tag (v2.0.0 was GHCR 404); per zero-:latest
    # policy the mutable tag is NOT used — the digest above is exact and immutable.
    # Wave 4 P1-10 (piston vendoring): a digest/vendor under
    # ghcr.io/heretek-ai/piston:<semver> CANNOT be minted from this env
    # (GHCR package-versions API -> 401 without auth; nothing can be pushed
    # from here — same fail-closed pattern as Wave 3 P1-9). Maintainer
    # release step (needs network + push rights): build piston from source
    # at a pinned release tag, `docker tag piston ghcr.io/heretek-ai/piston:<semver>`,
    # `docker push`, then replace the digest below with the pushed digest
    # (verify with `docker manifest inspect` first). Until then the exact
    # upstream digest pin stays (no :latest tag used, no digest invented).
    # DECISION NEEDED (product): vendor/self-build piston to ghcr.io/heretek-ai/piston:<semver>
    # to remove dependence on a floating upstream tag (see AUDIT_REPORT_FINDINGS.md P0-1e).
    # Wave D P1-5 fronting plan (tracked, honest): piston exposes an
    # unauthenticated /api/v2/execute RCE-as-a-service (no upstream auth
    # env exists — the sandbox is the only layer). sabotage-qa-tester's
    # exact-host curl pins (`curl -s http://piston:2000/api/v2/runtimes*`,
    # `curl -s -X POST http://piston:2000/api/v2/execute*`) are advisory
    # prefix allows, not a sandbox boundary (see AGENTS.md §4) — any
    # SSRF/prefix-bypass anywhere on the shared net reaches it. Front
    # :2000 with a shared-secret proxy (or per-request tokens mounted only
    # into sabotage-qa-tester) at the next hardening pass; until then:
    # expose-only, qa-testing/devsec profiles only, no host ports.
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    profiles: ["qa-testing", "devsec"]
    restart: unless-stopped
    expose:
      - "2000"
    volumes:
      - piston-packages:/piston/packages
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2000/api/v2/runtimes || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "2.0"
    mem_limit: 2g

  # ============================================================================
  # CATEGORY F: AGENT MEMORY, VECTOR STORES & KNOWLEDGE GRAPHS
  # ============================================================================
  qdrant:
    # Wave 4 P1-10: qdrant/qdrant:v1.12.5 -> v1.19.2 (Hub tag verified live
    # 2026-10-17; 7 minors). Auth: QDRANT__SERVICE__API_KEY (OSS image
    # supports it; fail-closed :? guard). Clients must send the key:
    # vector-rag-spec's mcp-server-qdrant==0.8.1 already passes it via
    # QDRANT_API_KEY env (PyPI latest 0.8.1, requires qdrant-client>=1.12.0
    # — compatible with server v1.19; no downgrade).
    image: qdrant/qdrant:v1.19.2
    profiles: ["ai-gateway"]
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env}"
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "4"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - heretek
    cpus: "1.5"
    mem_limit: 2g

  neo4j:
    # Wave 4 P1-10: neo4j:5.26.0-community-bullseye ->
    # 5.26.32-community-trixie (Hub tag verified live 2026-10-17; bullseye
    # oldstable EOL ~2026, misses Bouncy Castle/log4j fixes; 5.26 LTS line
    # kept deliberately, newest 5.26.x patch taken).
    image: neo4j:5.26.32-community-trixie
    profiles: ["ai-gateway"]
    restart: unless-stopped
    expose:
      - "7474"
      - "7687"
    ports:
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}"
      NEO4J_PLUGINS: '["apoc"]'
      server_memory_heap_initial__size: "512m"
      server_memory_heap_max__size: "1536m"
      server_memory_pagecache_size: "512m"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - heretek
    cpus: "1.5"
    mem_limit: 2.5g

  # ============================================================================
  # CATEGORY G: LLM GATEWAYS & CACHING
  # ============================================================================
  litellm:
    # Pinned by digest 2026-10-17 (skopeo inspect; tag main-v1.54.0 verified live on GHCR).
    # Upstream publishes main-vX.Y.Z, not vX.Y.Z (v1.54.0 was GHCR 404).
    image: ghcr.io/berriai/litellm@sha256:eb14f07d08318e638459eecc811fc3b30282f6b2397df3a98150a7d6ffd3f6d5
    profiles: ["ai-gateway"]
    restart: unless-stopped
    expose:
      - "4000"
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-paperclip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-paperclip}"
      STORE_MODEL_IN_DB: "True"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "1.0"
    mem_limit: 1.5g

  # ============================================================================
  # CATEGORY H: DEVELOPER TESTING, MOCKING & OBSERVABILITY
  # ============================================================================
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: ["qa-testing"]
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v1/messages || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - heretek
    cpus: "0.2"
    mem_limit: 256m

  minio:
    # Migrated to quay.io 2026-10-17: Docker Hub minio/minio is withdrawn
    # (Hub API returns {"message":"object not found"} for repo and all tags).
    # Wave 4 P1-10: authed skopeo digest-pin ATTEMPTED 2026-10-17 and
    # re-confirmed auth-gated (`skopeo inspect
    # docker://quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z` ->
    # "unauthorized: access to the requested resource is not authorized";
    # quay.io API -> 401; no quay credentials exist in this env). Exact
    # RELEASE tag pin retained, digest PENDING until authed pulls exist —
    # no digest invented. AGPLv3 IMPLICATION: minio/minio is AGPLv3-only;
    # running it as an unmodified sidecar over the network triggers no
    # source-distribution duty for our code, but any modification/redistribution
    # of the image itself must ship source (tracked product decision: evaluate
    # an S3 mock such as localstack at the next bump cycle).
    # Not a stub: the tag pin is exact and pulls wherever quay credentials exist.
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    profiles: ["qa-testing", "core"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    expose:
      - "9000"
      - "9001"
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "0.5"
    mem_limit: 1g

  wiremock:
    image: wiremock/wiremock:3.10.0-alpine
    profiles: ["qa-testing"]
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8089:8080"
    command: ["--verbose", "--global-response-templating"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - heretek
    cpus: "0.5"
    mem_limit: 512m

  jaeger:
    # Wave 4 P1-10: jaegertracing/all-in-one:1.63.0 (v1 EOL 2025-12-31) ->
    # jaegertracing/jaeger:2.22.0 (Hub tag verified live 2026-10-17). v2
    # keeps the all-in-one UI on :16686 and OTLP on :4317/:4318; the
    # COLLECTOR_OTLP_ENABLED env is v1-era (harmless if ignored by v2 —
    # retained so a v2 boot that rejects unknown envs fails visibly, not
    # silently; verify on first observability-profile up).
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    restart: unless-stopped
    expose:
      - "4317"
      - "4318"
      - "16686"
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - heretek
    cpus: "0.5"
    mem_limit: 1g

  # ============================================================================
  # CATEGORY I: MOBILE DEVICE & EMULATION TESTING
  # ============================================================================
  docker-android:
    image: budtmo/docker-android:emulator_14.0_v3.8.0-p1
    # PROFILE GATING (P1-6): privileged + /dev/kvm. Enable --profile mobile
    # only on dedicated test hosts, never alongside untrusted workloads or
    # with the devsec profile on shared infrastructure.
    # Wave C P1-14 RESOURCING: full AOSP + noVNC realistically wants 4+ CPUs
    # and 6-8g RAM — 2.0/4g OOMs or boot-timeouts. HOST REQUIREMENT: do not
    # enable --profile mobile on hosts with < 8g free RAM and < 4 free CPUs;
    # on smaller hosts the emulator will fail closed (healthcheck stays
    # unhealthy) rather than run degraded.
    # Wave 4 P1-12 SEGMENTATION: the privileged emulator moves off the
    # shared heretek bridge onto the isolated heretek-mobile net (paperclip
    # joins it too — see the paperclip extension at the end of this file).
    # Enforced additionally by the Makefile co-scheduling guard, which
    # refuses --profile mobile together with devsec/web-research.
    profiles: ["mobile"]
    restart: unless-stopped
    privileged: true
    devices:
      - "/dev/kvm:/dev/kvm"
    expose:
      - "5555"
      - "6080"
    ports:
      - "127.0.0.1:5555:5555"
      - "127.0.0.1:6080:6080"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
    volumes:
      - docker-android-data:/root
    healthcheck:
      # Wave C P1-14: `adb` on PATH inside budtmo/docker-android is
      # UNVERIFIED upstream — a bare `adb devices` probe would report
      # unhealthy forever if adb is absent. Dual probe: emulator booted
      # (adb sees a device) OR the noVNC listener answers on :6080
      # (container alive, emulator still booting). Either signal counts
      # as healthy; neither for 5x20s+60s-start counts as failed.
      test: ["CMD-SHELL", "(command -v adb >/dev/null 2>&1 && adb devices 2>/dev/null | grep -q device) || (wget -q -O /dev/null http://127.0.0.1:6080) || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - heretek-mobile
    cpus: "4.0"
    mem_limit: 8g

  # ============================================================================
  # CATEGORY J: CONTAINERIZED LOCAL CI/CD RUNNER (ACT)
  # ============================================================================
  local-ci-runner:
    # NOTE: requires the socket proxy at runtime: run with
    #   docker compose -f docker-compose.yml -f docker-compose.sidecars.yml --profile core --profile ci up
    # (proxy lives in the "core" profile; "ci" alone never schedules it).
    #
    # Wave 3 P1-3 (design decision, option a — READ-ONLY OBSERVER): this
    # container shells into a quarantined act-ready image (`sleep infinity`,
    # workflows mounted :ro) with DOCKER_HOST pointed at the GET-only
    # socket proxy, so it can INSPECT the daemon (list containers/images,
    # read version/info, diagnose CI state) but CANNOT mutate it —
    # create/build/exec/auth are denied at the proxy (POST/BUILD/EXEC=0).
    # Mutating CI runs (`act` jobs that build, create, or exec) execute on
    # the HOST via host-installed `act` against the host Docker daemon, NOT
    # from inside this container. Do not "fix" CI by enabling proxy writes
    # or mounting /var/run/docker.sock here (see P1-12); that re-opens the
    # host-escape the proxy exists to close.
    image: ghcr.io/catthehacker/ubuntu:act-22.04
    profiles: ["ci", "qa-testing", "core"]
    restart: "no"
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    command: ["sleep", "infinity"]
    environment:
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
    # Wave 4 P1-12 (runner hardening): the shared checkout mounts
    # read-only; the runner gets exactly one writable path, the dedicated
    # /scratch volume (bind-mounted from ./workspaces/scratch, created by
    # compose on first up). Anything the runner must persist goes to
    # /scratch — the quarantined observer can no longer write into live
    # agent checkouts.
    volumes:
      - ./.github/workflows:/workflows:ro
      - ./workspaces:/paperclip/workspaces:ro
      - ./workspaces/scratch:/scratch:rw
    networks:
      - heretek
    cpus: "2.0"
    mem_limit: 4g

  # ----------------------------------------------------------------------------
  # WAVE 4 P1-12: PAPERCLIP SEGMENT ATTACHMENT (compose-merge extension)
  # ----------------------------------------------------------------------------
  # paperclip is defined in docker-compose.yml (base heretek net only). This
  # merge entry attaches it to the two isolated segment nets (heretek-devsec,
  # heretek-mobile declared below) so agent reachability into ghidra/radare2
  # and docker-android is preserved after those services leave the shared
  # bridge. Compose merges the networks lists across the -f files; `config`
  # on every profile combo must stay green (Wave 4 acceptance).
  paperclip:
    networks:
      - heretek
      - heretek-devsec
      - heretek-mobile

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  firecrawl-redis-data:
  firecrawl-rabbitmq-data:
  firecrawl-nuq-data:
  mitmproxy-certs:
  ghidra-projects:
  hound-data:
  semgrep-cache:
  piston-packages:
  qdrant-storage:
  neo4j-data:
  neo4j-logs:
  minio-data:
  docker-android-data:

# ==============================================================================
# NETWORKS
# ==============================================================================
# Wave 3 P1-2: compose-MANAGED network (not external). `docker-compose.yml`
# creates this same `heretek` bridge, and both files declare `name: heretek`,
# so the merged stack (`-f docker-compose.yml -f docker-compose.sidecars.yml`)
# and the base stack alone attach every service to one Docker network
# literally named `heretek`. Previously this block said `external: true`,
# which won the file merge and made every sidecar-profile `up` fail unless
# the operator had pre-created the network out of band (undocumented).
# Managed is the fail-closed default: `up` creates what `config` references.
networks:
  heretek:
    name: heretek
    driver: bridge
  # Wave 4 P1-12 SEGMENTATION (minimal viable): the two highest-risk
  # segments get isolated bridge nets (ghidra+radare2 handle untrusted
  # samples; docker-android is privileged + /dev/kvm). paperclip joins both
  # (extension above) so only it bridges the segments. Everything else stays
  # on the shared heretek bridge deliberately: full per-category segmentation
  # (web/ai/qa/obs) would split meshes that must stay connected at runtime
  # (firecrawl -> redis/rabbitmq/nuq-postgres/playwright; runner -> proxy)
  # and cannot be boot-verified without a live stack — tracked hardening
  # item, NOT chased here at the cost of breaking the tree.
  heretek-devsec:
    name: heretek-devsec
    driver: bridge
  heretek-mobile:
    name: heretek-mobile
    driver: bridge

