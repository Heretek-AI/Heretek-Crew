# Heretek-Crew: Paperclip + OpenCode v2 stack.
#
# Profiles:
#   default ................ postgres + paperclip (private, 127.0.0.1:3100)
#   --profile proxy ........ + caddy reverse proxy with automatic TLS (80/443)
#   --profile tailscale .... + tailscale sidecar for private mesh access
#
# Quickstart (after `cp .env.example .env` and editing secrets):
#   docker build -t paperclip:official-local /tmp/paperclip   # official base
#   docker compose build                                       # wave1 layer
#   docker compose up -d
#
# Pinned images (never `latest`): postgres:17.11-alpine@sha256:b0f956… (Wave E
# Stage 4 P2-3: 17-alpine == 17.11-alpine verified live 2026-10-17),
# caddy:2.11.7-alpine,
# tailscale/tailscale:v1.104.1. The paperclip image pins node:24-trixie-slim
# (via the official base) and @opencode/cli + @opencode/client 2.0.32
# (see docker/Dockerfile).

name: heretek-crew

services:
  postgres:
    # Wave E Stage 4 P2-3 (pinned live 2026-10-17): exact minor + digest.
    # `17-alpine` was resolved live to 17.11-alpine (registry
    # Docker-Content-Digest of both tags identical:
    # sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24)
    # and pinned as tag@digest below — zero behavior change (the digest
    # wins; the tag is the human-readable provenance). Quarterly bump plan
    # (owned by dependency-patcher): re-resolve `17-alpine` live, and when
    # the digest moves, bump the tag+digest together (never the tag alone,
    # never an offline-invented digest).
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
      # Password for the read-only paperclip_reader role provisioned at first
      # boot by scripts/postgres-init-readonly-role.sh (P0-2/P1-8). The hook
      # refuses CHANGE_ME__ placeholders, so compose fails closed here too.
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?POSTGRES_READER_PASSWORD must be set in .env (generate with openssl rand -base64 24)}
    # Internal network only: no ports published; reachable as `postgres:5432`.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-paperclip} -d $${POSTGRES_DB:-paperclip}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only-role provisioning hook (P0-2/P1-8): creates paperclip_reader
      # (SELECT-only + default_transaction_read_only) on first boot against a
      # fresh volume. Existing volumes do not re-run initdb hooks — apply the
      # --dry-run SQL manually there (see the script header).
      - ./scripts/postgres-init-readonly-role.sh:/docker-entrypoint-initdb.d/01-readonly-role.sh:ro
    networks:
      - heretek
    # Resource caps (P1-9): bound the database alongside the fleet.
    cpus: "1.0"
    mem_limit: 1g
    # Hardening (P2-3): drop all capabilities except the minimal set the
    # official postgres entrypoint needs to chown the data volume and gosu
    # down to the postgres user (CHOWN, DAC_OVERRIDE, SETGID, SETUID).
    # read_only is NOT set: the server writes /var/lib/postgresql/data (named
    # volume), /var/run/postgresql and /tmp at runtime — a read-only root
    # would need live-boot verification (tracked). no-new-privileges blocks
    # privilege gain only; the entrypoint's root-to-postgres drop still works.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  paperclip:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Wave D P2-5: base-image digest pin plan. PAPERCLIP_BASE_IMAGE is a
        # locally-built tag (paperclip:official-local) with no registry
        # digest to pin — the pin that matters is the Paperclip SOURCE
        # commit it was built from (recorded in docker/Dockerfile +
        # NOTES.md; verify with `git -C /tmp/paperclip rev-parse HEAD`
        # before building). If the base ever moves to a registry image,
        # pin the immutable digest here (image@sha256:<digest>) and
        # constrain HERETEK_IMAGE overrides to digest pins only.
        PAPERCLIP_BASE_IMAGE: ${PAPERCLIP_BASE_IMAGE:-paperclip:official-local}
    image: heretek-crew/paperclip:wave1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-bound: the UI/API is private by default; expose via the
    # `proxy` (caddy) or `tailscale` profiles for remote access.
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      # Wave D P2-7.1 password-file plan (tracked, honest): the superuser
      # password is embedded in this URL and therefore visible to
      # `docker inspect`, /proc/<pid>/environ and transcript dumps.
      # Preferred: Docker secret / password-file mounted at runtime with
      # the URL assembled inside the entrypoint. Until then the
      # compensating controls are: (a) agent-reachable database access
      # goes ONLY through POSTGRES_READONLY_URL (paperclip_reader,
      # SELECT-only + read-only transactions — the seed-50 preflight
      # rejects superuser URLs in agent payloads); (b) this server-side
      # URL never enters adapterConfig.env (smoke §4 asserts the seed
      # payloads carry no DATABASE_URL/POSTGRES_PASSWORD).
      DATABASE_URL: postgres://${POSTGRES_USER:-paperclip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-paperclip}
      # Defense-in-depth: stop agent runtimes from loading repository
      # workspace project configs (prevents workspace git pollution).
      # Mirrored per-agent in the seed payloads' adapterConfig.env and
      # asserted on the rendered config by scripts/smoke-test.sh §2.
      OPENCODE_DISABLE_PROJECT_CONFIG: "true"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env (generate with openssl rand -base64 48)}"
      # Independent secret for signed approval-gated tool actions.
      # Wave D P2-7.3 (fail-closed): an empty default would silently
      # DISABLE signature verification, so none is shipped — compose
      # refuses to start until a real secret is provisioned (generate
      # with openssl rand -base64 32; see .env.example).
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?PAPERCLIP_TOOL_ACTION_SIGNING_SECRET must be set in .env (generate with openssl rand -base64 32; empty disables tool-action signature verification)}
      # Wave 2 MCP credential scoping (P0-2/P1-8): the dba postgres MCP
      # server connects ONLY through this read-only-role URL (the seed gate
      # rejects superuser URLs), and the 7 github-backed roles authenticate
      # through this scoped PAT. Both fail closed (:? — no defaults).
      POSTGRES_READONLY_URL: ${POSTGRES_READONLY_URL:?POSTGRES_READONLY_URL must be set in .env (paperclip_reader URL; see roles/dba-specialist/AGENTS.md §4)}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set in .env (scoped read-only PAT for github MCP roles)}
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}
      # Model provider API keys forwarded into Paperclip and agent runtimes:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    volumes:
      - paperclip-data:/paperclip
      # Per-role OpenCode v2 configs (roles/<role>/opencode/opencode.json),
      # consumed via each agent's env.XDG_CONFIG_HOME=/roles/<role>.
      - ./roles:/roles:ro
      # Agent working checkouts live here on the host for inspection/backup.
      - ./workspaces:/paperclip/workspaces
      # Read-only kubeconfig for k8s-orchestrator's kubernetes MCP server
      # (P0-2): the mounted file's context must be bound to a read-only
      # ClusterRole. Fail-closed chain: :? requires the path, the seed gate
      # requires it to be a regular file (compose bind-mounts would otherwise
      # materialize a directory), :ro blocks container writes.
      # Wave D P0-3a scoping plan (tracked, honest): this bind is visible
      # to the whole paperclip server (one UID/mount namespace shared by
      # all agents — XDG isolates config only), so every role carries
      # fs:read denies for **/secrets/** + **/kubeconfig* (smoke §3b
      # asserts them fleet-wide). The structural fix is to move the
      # kubeconfig OUT of the filesystem entirely — into the MCP server
      # env via a file descriptor the fs tools cannot address — so only
      # k8s-orchestrator's server process ever sees it. Until that
      # lands, the read-only ClusterRole binding is the containment.
      - ${KUBECONFIG_READONLY_PATH:?KUBECONFIG_READONLY_PATH must be set in .env (host path of the read-only kubeconfig)}:/paperclip/secrets/kubeconfig-readonly:ro
    networks:
      - heretek
    # Resource limits: a runaway agent fleet must not starve the host.
    # Includes the shared 30s adapter-settlement window and final cleanup.
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 2048
    stop_grace_period: 90s
    # Healthcheck (P1-9): the served UI root must answer. Reports unhealthy
    # only (dependents use start-order depends_on, never health-gated), so a
    # slow first boot degrades to a flag, never a restart loop.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:$${PORT:-3100}/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    # Capability note (P1-9, P2-3): NO cap_drop here — the inherited entrypoint
    # repairs /paperclip ownership as root before `exec gosu node`
    # (see docker/Dockerfile runtime-user note); dropping caps would break
    # first boot on fresh named volumes. Least-privilege is enforced above
    # it: loopback-only ports, read-only /roles mount, scoped env.
    # read_only is likewise NOT set (P2-3): the server writes
    # ./workspaces:/paperclip/workspaces and paperclip-data:/paperclip by
    # design (agent checkouts, sqlite/state), plus /tmp — a read-only root
    # needs live-boot verification before it can be claimed (tracked plan
    # only: read_only:true + tmpfs mounts for /tmp + /run once a live boot
    # proves the entrypoint + server survive it; do NOT set read_only
    # without that live run).
    # no-new-privileges IS safe: it blocks privilege gain, not the
    # entrypoint's root-to-node drop, and agent children never gain privs.
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.7-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - paperclip
    # NOTE: PROXY_DOMAIN defaults to `localhost` so the default profile
    # (`docker compose config/up` without --profile proxy) always parses,
    # even with PROXY_DOMAIN empty/unset in .env. Set PROXY_DOMAIN to a real
    # public hostname when using `--profile proxy` to get automatic TLS;
    # leaving it unset under the proxy profile serves localhost only.
    # Wave D P3-4 (optional, tracked): for multi-host or header/logging
    # control, replace this one-liner with a mounted Caddyfile (more
    # auditable); the single-host one-liner stays until that need arises.
    command: ["reverse-proxy", "--from", "${PROXY_DOMAIN:-localhost}", "--to", "paperclip:3100"]
    # EXPOSURE NOTE (P1-6, P1-11): unlike every other service in this stack
    # (loopback-bound or internal-only), the proxy profile binds 80/443 on
    # ALL interfaces. Enable --profile proxy only with
    # PAPERCLIP_DEPLOYMENT_EXPOSURE=private (default above) plus real
    # authentication, and never expose the loopback-bound :3100 directly.
    # Wave D P2-6: this note is enforced, not honor-system — `make
    # proxy-up` (Makefile guard-proxy) refuses --profile proxy unless
    # PAPERCLIP_DEPLOYMENT_EXPOSURE=private AND BETTER_AUTH_SECRET is a
    # real (non-placeholder) secret. Do not bypass the guard with raw
    # `docker compose --profile proxy up`. Tracked hardening (P1-11):
    # a compose-level fail-closed gate (`test $EXPOSURE = private &&
    # exec caddy…`) would move enforcement out of the Makefile alone —
    # deferred: caddy has no shell entrypoint hook for the test without
    # an image change, so the Makefile guard + this note stay the gate.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    networks:
      - heretek
    # Hardening (P1-9): drop all capabilities except the one needed to bind
    # the privileged 80/443 ports; bound the proxy's footprint.
    # no-new-privileges blocks setuid gain; caddy never needs it (P2-3).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 512m
    # Healthcheck (P1-9): the :80 listener answers with some HTTP response
    # (even a vhost-mismatch 404 proves the server is alive; `reverse-proxy`
    # disables the :2019 admin endpoint, so it must NOT be probed).
    # Proxy-profile only, like the service.
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  tailscale:
    image: tailscale/tailscale:v1.104.1
    profiles: ["tailscale"]
    restart: unless-stopped
    depends_on:
      - paperclip
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-heretek-paperclip}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---advertise-tags=tag:heretek}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Hardening (P1-9): drop everything except the two mesh capabilities
    # above (required for /dev/net/tun; see P2-5). Bound the sidecar.
    # Stays profile-gated (tailscale profile only — never in the default
    # stack) and no-new-privileges blocks setuid gain without affecting
    # tun setup, which uses capabilities, not new privileges (P2-3).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 256m
    networks:
      - heretek
    # Healthcheck (P1-9): tailscaled liveness via its control socket
    # (login state is out of scope — an unauthed key must not flap health).
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/tailscale/tailscaled.sock || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  paperclip-data:
  caddy-data:
  tailscale-state:

networks:
  heretek:
    # Wave 3 P1-2: pinned to the literal name `heretek` so the base stack
    # alone and the merged sidecar stack share ONE network. Matches the
    # `name: heretek` declaration in docker-compose.sidecars.yml (merged
    # config keeps this name); compose manages it (no `external: true`
    # anywhere — `up` creates what `config` references).
    name: heretek
    driver: bridge
