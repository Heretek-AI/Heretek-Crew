name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom image tag (leave blank for default git tags / sha)"
        required: false
        type: string
        default: ""
      paperclip_base:
        description: "Upstream Paperclip base image"
        required: false
        type: string
        default: "ghcr.io/paperclipai/paperclip:sha-73659c6"
      push:
        description: "Push images to GHCR (set false for dry-run verification)"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish Heretek-Crew
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Wave C P0-6: NO `latest` tag is minted here, ever. The repo's
            # never-:latest invariant (AGENTS.md §4) forbids mutable tags;
            # consumers pin the exact semver (`:1.0.0`) or a `sha-*` digest.
            # (A `type=raw,value=latest` line was removed for this reason —
            # do not re-add it; cut a semver release instead.)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=heretek-crew
            org.opencontainers.image.description=Production Paperclip + OpenCode v2 autonomous agent fleet runtime
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            heretek.paperclip.base=${{ inputs.paperclip_base || 'ghcr.io/paperclipai/paperclip:sha-73659c6' }}
            heretek.opencode.cli=2.0.32
            heretek.opencode.client=2.0.32
            heretek.opencode.harness=1.0.9

      - name: Pre-publish Image Verification (Native amd64)
        run: |
          set -euo pipefail
          echo "Building native amd64 verification image..."
          BASE_IMG="${{ inputs.paperclip_base || 'ghcr.io/paperclipai/paperclip:sha-73659c6' }}"
          docker build \
            --build-arg PAPERCLIP_BASE_IMAGE="${BASE_IMG}" \
            -f docker/Dockerfile \
            -t heretek-crew:verify .

          echo "Running verification assertions against built image..."
          # 1. Verify compatibility shim executes and reports a version.
          # Fail-closed: --version is REQUIRED (a --help fallback would mask
          # a broken shim that execs nothing — see P1-9).
          docker run --rm heretek-crew:verify /usr/local/bin/opencode --version
          # 2. Verify binary opencode-bin is present and functional
          docker run --rm heretek-crew:verify /usr/local/bin/opencode-bin --version
          # 3. Verify @heretek-ai/opencode-harness + opencode-mem +
          # @prevalentware/opencode-goal-plugin are installed globally
          # (Wave C P0-5: goal-plugin added — exec-director references it)
          docker run --rm heretek-crew:verify npm ls -g --depth=0 @heretek-ai/opencode-harness opencode-mem @prevalentware/opencode-goal-plugin
          # 3b. Wave C P0-5 plugin-resolution gate: EVERY plugin string in
          # any roles/*/opencode/opencode.json must resolve to a globally
          # installed package in this image. The plugin list is extracted
          # from the checked-out repo (jq over the exact `plugins`
          # arrays — not grep); each entry is asserted via `npm ls -g` inside the
          # image. A role referencing an unpublished plugin (e.g. the
          # removed `opencode-rea`, npm E404) fails the publish here
          # instead of materializing as a role whose designed tool surface
          # can never load.
          echo "Running plugin-resolution gate (role plugins -> npm ls -g)..."
          command -v jq >/dev/null 2>&1 || { echo "gate FAIL: jq is required on the runner" >&2; exit 1; }
          : > /tmp/wavec-plugins.txt
          for f in roles/*/opencode/opencode.json; do
            count="$(jq -r '.plugins | length' "${f}")"
            if [ "${count}" -eq 0 ]; then
              echo "gate FAIL: plugins missing/empty in ${f}" >&2
              exit 1
            fi
            jq -r '.plugins[]' "${f}" >> /tmp/wavec-plugins.txt
          done
          sort -u /tmp/wavec-plugins.txt -o /tmp/wavec-plugins.txt
          echo "tracked role plugins: $(tr '\n' ' ' < /tmp/wavec-plugins.txt)"
          while IFS= read -r plugin; do
            [ -n "${plugin}" ] || continue
            case "${plugin}" in
              opencode-harness) plugin="@heretek-ai/opencode-harness" ;;
            esac
            if ! docker run --rm heretek-crew:verify npm ls -g --depth=0 "${plugin}" >/dev/null 2>&1; then
              echo "gate FAIL: role plugin '${plugin}' not installed globally (unresolvable at runtime)" >&2
              exit 1
            fi
          done < /tmp/wavec-plugins.txt
          echo "plugin-resolution gate PASSED"
          # 4. Verify system dependencies
          docker run --rm heretek-crew:verify tini --version
          docker run --rm heretek-crew:verify rg --version
          docker run --rm heretek-crew:verify python3 --version
          # 5. Wave B P1-11 shim translation gate: fixture argv through
          # /usr/local/bin/opencode must arrive at opencode-bin merged
          # (--model#variant) with exactly one --auto and no --dir leak.
          # A recorder stands in for opencode-bin via OPENCODE_REAL_BIN
          # (honored by the shim); no model call is made.
          echo "Running shim translation gate (fixture argv -> opencode-bin)..."
          docker run --rm --entrypoint /bin/sh heretek-crew:verify -c '
            set -euo pipefail
            printf "%s\n" "#!/bin/sh" "printf \"%s\\n\" \"\$@\" > /tmp/shim-args" > /tmp/record-bin.sh
            chmod +x /tmp/record-bin.sh
            OPENCODE_REAL_BIN=/tmp/record-bin.sh /usr/local/bin/opencode run --format json --dir /tmp/ws --model opencode/gemini-3.8-flash --variant high "gate probe"
            grep -qx -- "--auto" /tmp/shim-args
            test "$(grep -c -- "--auto" /tmp/shim-args)" -eq 1
            grep -qx "opencode/gemini-3.8-flash#high" /tmp/shim-args
            if grep -qx -- "--dir" /tmp/shim-args; then echo "gate FAIL: shim leaked --dir" >&2; exit 1; fi
            echo "shim translation gate PASSED"
          '
          # 6. Wave B P1-11 harness plugin-load gate: the pinned harness must
          # initialize with an empty-string directory (the AUDIT P0-1
          # fail-closed rootDir kill) instead of throwing. Sequencing note:
          # the upstream fix LANDED in 1.0.9 (pick() guard over the four
          # context slots, verified 2026-10-18: live setup({directory:''})
          # NO-THROW) and docker/Dockerfile now pins 1.0.9 — so this gate
          # expects PASSED on the bumped harness. A FAIL here is the gate
          # working (fail-closed must-not-throw on empty-string), not gate
          # breakage. Re-pin the export lookup below when the harness
          # module map changes.
          echo "Running harness plugin-load gate..."
          docker run --rm --entrypoint /bin/sh heretek-crew:verify -c '
            set -euo pipefail
            export HARNESS_MOD="$(npm root -g)/@heretek-ai/opencode-harness/dist/index.js"
            test -f "${HARNESS_MOD}" || { echo "gate FAIL: harness dist missing at ${HARNESS_MOD}" >&2; exit 1; }
            cat > /tmp/harness-gate.cjs <<NODE_EOF
          const h = require(process.env.HARNESS_MOD);
          const setup = h.setupOpenCodeV2Harness || (h.default && h.default.setup);
          if (typeof setup !== "function") { console.error("gate FAIL: harness setup export not found; re-pin gate to the bumped harness"); process.exit(1); }
          try { setup({ directory: "" }); }
          catch (e) { console.error("gate FAIL: harness Dies on empty-string directory: " + (e && e.message)); process.exit(1); }
          console.log("harness plugin-load gate PASSED");
          NODE_EOF
            node /tmp/harness-gate.cjs
          '
          echo "Native image verification PASSED."

      - name: Pre-publish arm64 Smoke (QEMU-emulated, before push)
        run: |
          set -euo pipefail
          # Wave B P1-11 (Beta P2-12): the push claims linux/arm64, so arm64
          # is smoked BEFORE the push step below. QEMU is set up above, which
          # makes this feasible; if emulation is ever unavailable this step
          # fails closed (no silent untested-arch push) — do not delete it,
          # fix the runner instead.
          echo "Building linux/arm64 verification image (QEMU-emulated)..."
          BASE_IMG="${{ inputs.paperclip_base || 'ghcr.io/paperclipai/paperclip:sha-73659c6' }}"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg PAPERCLIP_BASE_IMAGE="${BASE_IMG}" \
            -f docker/Dockerfile \
            -t heretek-crew:verify-arm64 \
            --load .
          echo "Running arm64 smoke assertions..."
          docker run --rm --platform linux/arm64 heretek-crew:verify-arm64 /usr/local/bin/opencode --version
          docker run --rm --platform linux/arm64 heretek-crew:verify-arm64 /usr/local/bin/opencode-bin --version
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh heretek-crew:verify-arm64 -c '
            set -euo pipefail
            printf "%s\n" "#!/bin/sh" "printf \"%s\\n\" \"\$@\" > /tmp/shim-args" > /tmp/record-bin.sh
            chmod +x /tmp/record-bin.sh
            OPENCODE_REAL_BIN=/tmp/record-bin.sh /usr/local/bin/opencode run --model opencode/gemini-3.8-flash --variant high "arm64 probe"
            grep -qx "opencode/gemini-3.8-flash#high" /tmp/shim-args
            grep -qx -- "--auto" /tmp/shim-args
            echo "arm64 shim smoke PASSED"
          '
          echo "arm64 smoke PASSED."

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            PAPERCLIP_BASE_IMAGE=${{ inputs.paperclip_base || 'ghcr.io/paperclipai/paperclip:sha-73659c6' }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
